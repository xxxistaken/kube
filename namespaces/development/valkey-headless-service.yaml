# StatefulSet 的 governing Service，为 valkey-0 提供稳定网络标识。
apiVersion: v1
kind: Service
metadata:
  name: valkey-headless
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: cache
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
      protocol: TCP

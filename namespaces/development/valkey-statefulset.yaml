apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: cache
spec:
  serviceName: valkey-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/component: cache
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: valkey
          image: valkey/valkey:9-trixie
          imagePullPolicy: IfNotPresent
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          env:
            # Secret secrets/vkPassword 由集群侧维护，不在本仓库内；
            # Kubernetes 会在 args 中把 $(VALKEY_PASSWORD) 展开成实际密码。
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: vkPassword
          # 镜像的 ENTRYPOINT 会先以 root 把 /data 的属主改成 valkey，再降权运行，
          # 所以这里只需给出启动参数；必须保留 valkey-server 作为第一个参数。
          args:
            - valkey-server
            - --dir
            - /data
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --requirepass
            - $(VALKEY_PASSWORD)
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'test "$(valkey-cli --no-auth-warning -a "$VALKEY_PASSWORD" ping)" = "PONG"'
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'test "$(valkey-cli --no-auth-warning -a "$VALKEY_PASSWORD" ping)" = "PONG"'
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
